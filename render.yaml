databases:
  - name: wedding-db
    plan: free

services:
  - type: web
    name: wedding-site
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      flask --app app db upgrade
      python seed_from_json.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-db
          property: connectionString
